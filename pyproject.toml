[project]
name = "joltio"
version = "0.2.0"
description = "Cliente Python y CLI de Joltio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "httpx>=0.28",
  "polars>=1.0",
  "pydantic>=2.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://joltio.app/data"
Documentation = "https://joltio.app/data/docs"
Repository = "https://github.com/datons/python-joltio"
Changelog = "https://github.com/datons/python-joltio/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["httpx2>=2.13", "fastmcp>=4.0"]
pandas = ["pandas>=2.0"]
parquet = ["pyarrow>=25.0"]

[project.scripts]
joltio = "joltio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joltio", "joltio_toolkit"]

[tool.hatch.build.targets.wheel.force-include]
"joltio_toolkit/data/openapi.json" = "joltio_toolkit/data/openapi.json"
"joltio_toolkit/data/data-api-openapi.json" = "joltio_toolkit/data/data-api-openapi.json"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
